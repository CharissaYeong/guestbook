apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
        - image: nginxdemos/hello:plain
          name: guestbook-ui
          ports:
            - containerPort: 80
          env:
            - name: GET_HOST_FROM
              value: dns